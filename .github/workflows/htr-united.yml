name: HTR-United Quality Assurance
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install HTRVX
        run: pip install htrvx

      - name: Test XML files
        run: htrvx ./data/**/*.xml --segmonto --check-empty --raise-empty --xsd

      - name: Install ChocoMufin
        run: pip install chocomufin

      - name: Run ChocoMufin
        run: chocomufin generate ./data/**/*.xml
